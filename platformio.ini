[platformio]
; `pio run` sem -e compila só o totem de verdade (upload não dispara varios envs).
default_envs = esp32-s3-devkitc-1

[env]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

; ESP_login.cpp e ESP_cardapio.cpp tem seu proprio setup()/loop() (exemplos
; soltos, nao fazem parte do firmware do totem) -- cada um tem seu env.
build_src_filter = +<*> -<ESP_login.cpp> -<ESP_cardapio.cpp>

lib_deps =
    adafruit/Adafruit GFX Library
    zinggjm/GxEPD2
    olikraus/U8g2_for_Adafruit_GFX
    geekfactory/GeekFactory GFButton Library
    https://github.com/wallysalami/QRCodeGFX.git
    miguelbalboa/MFRC522
    256dpi/MQTT

; Totem de verdade. Trocar o papel aqui (1=entrada 2=saida 3=comida 4=palco).
[env:esp32-s3-devkitc-1]
build_flags = -DTOTEM_PAPEL=1

; Teste de layout das telas: só precisa do ESP32-S3 + e-paper ligados.
;   pio run -e teste -t upload && pio device monitor -e teste
[env:teste]
build_flags = -DTOTEM_PAPEL=5

; Firmware de login (RFID -> totem/rfid), testado isolado do resto.
;   pio run -e login -t upload
[env:login]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.30-2/platform-espressif32.zip
lib_extra_dirs = ~/Documents/Arduino/libraries
build_type = release

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -Os
    -Wl,--gc-sections

build_src_filter =
    -<*>
    +<ESP_login.cpp>

board_build.filesystem = littlefs
board_build.partitions = partitions.csv
board_upload.flash_size = 16MB
board_upload.before_reset = usb_reset
upload_speed = 921600
