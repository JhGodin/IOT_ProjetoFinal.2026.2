<!-- ///////gabriel/////// resumo do pedido gravado no banco -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido confirmado</title>
</head>
<body>
  <h1>Pedido confirmado, {{ nome }}!</h1>

  <table border="1" cellpadding="6">
    <tr>
      <th>Item</th>
      <th>Quantidade</th>
      <th>Subtotal</th>
    </tr>
    {% for item in itens %}
    <tr>
      <td>{{ item.nome }}</td>
      <td>{{ item.quantidade }}</td>
      <td>{{ item.subtotalTexto }}</td>
    </tr>
    {% endfor %}
  </table>

  <p>Total deste pedido: <strong>{{ total }}</strong></p>
  <p>Total consumido no festival (a pagar na saída): <strong>{{ divida }}</strong></p>

  <form action="{{ voltar }}" method="GET">
    <button type="submit">Fazer outro pedido</button>
  </form>
</body>
</html>
