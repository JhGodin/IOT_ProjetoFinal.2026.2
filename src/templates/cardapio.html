<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <title>Cardápio do dia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta charset="UTF-8">


<style>
  /* Reset básico */
  *, ::after, ::before {
    box-sizing: border-box;
  }
  
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", "Noto Sans", "Liberation Sans", Arial, sans-serif;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.5;
    color: #212529;
    background-color: #fff;
  }
  
  h1, h5 {
    margin-top: 0;
    margin-bottom: 0.5rem;
    font-weight: 500;
    line-height: 1.2;
  }
  
  h1 {
    font-size: calc(1.375rem + 1.5vw);
  }
  
  @media (min-width: 1200px) {
    h1 {
      font-size: 2.5rem;
    }
  }
  
  h5 {
    font-size: 1.25rem;
  }
  
  label {
    display: inline-block;
  }
  
  button {
    border-radius: 0;
  }
  
  button:focus:not(:focus-visible) {
    outline: 0;
  }
  
  button, input {
    margin: 0;
    font-family: inherit;
    font-size: inherit;
    line-height: inherit;
  }
  
  /* Container */
  .container {
    width: 100%;
    padding-right: calc(1.5rem * 0.5);
    padding-left: calc(1.5rem * 0.5);
    margin-right: auto;
    margin-left: auto;
  }
  
  @media (min-width: 576px) {
    .container {
      max-width: 540px;
    }
  }
  
  @media (min-width: 768px) {
    .container {
      max-width: 720px;
    }
  }
  
  @media (min-width: 992px) {
    .container {
      max-width: 960px;
    }
  }
  
  @media (min-width: 1200px) {
    .container {
      max-width: 1140px;
    }
  }
  
  @media (min-width: 1400px) {
    .container {
      max-width: 1320px;
    }
  }
  
  /* Grid */
  .row {
    display: flex;
    flex-wrap: wrap;
    margin-right: calc(-0.5 * 1.5rem);
    margin-left: calc(-0.5 * 1.5rem);
  }
  
  .row > * {
    flex-shrink: 0;
    width: 100%;
    max-width: 100%;
    padding-right: calc(1.5rem * 0.5);
    padding-left: calc(1.5rem * 0.5);
  }
  
  @media (min-width: 768px) {
    .col-md-6 {
      flex: 0 0 auto;
      width: 50%;
    }
  }
  
  @media (min-width: 576px) {
    .col-sm-6 {
      flex: 0 0 auto;
      width: 50%;
    }
  }
  
  /* Form */
  .form-label {
    margin-bottom: 0.5rem;
  }
  
  .form-control {
    display: block;
    width: 100%;
    padding: 0.375rem 0.75rem;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.5;
    color: #212529;
    background-color: #fff;
    background-clip: padding-box;
    border: 1px solid #dee2e6;
    border-radius: 0.375rem;
    appearance: none;
    transition: border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
  }
  
  .form-control:focus {
    color: #212529;
    background-color: #fff;
    border-color: #86b7fe;
    outline: 0;
    box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.25);
  }
  
  .form-check {
    display: block;
    min-height: 1.5rem;
    padding-left: 1.5em;
    margin-bottom: 0.125rem;
  }
  
  .form-check .form-check-input {
    float: left;
    margin-left: -1.5em;
  }
  
  .form-check-input {
    width: 1em;
    height: 1em;
    margin-top: 0.25em;
    vertical-align: top;
    background-color: #fff;
    background-repeat: no-repeat;
    background-position: center;
    background-size: contain;
    border: 1px solid #dee2e6;
    appearance: none;
  }
  
  .form-check-input[type="checkbox"] {
    border-radius: 0.25em;
  }
  
  .form-check-input:checked {
    background-color: #0d6efd;
    border-color: #0d6efd;
  }
  
  .form-check-input:checked[type="checkbox"] {
    background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 20 20'%3e%3cpath fill='none' stroke='%23fff' stroke-linecap='round' stroke-linejoin='round' stroke-width='3' d='m6 10 3 3 6-6'/%3e%3c/svg%3e");
  }
  
  .form-check-label {
    cursor: pointer;
  }
  
  /* Card */
  .card {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 0;
    word-wrap: break-word;
    background-color: #fff;
    background-clip: border-box;
    border: 1px solid rgba(0, 0, 0, 0.175);
    border-radius: 0.375rem;
  }
  
  .card-body {
    flex: 1 1 auto;
    padding: 1rem 1rem;
  }
  
  .card-header {
    padding: 0.5rem 1rem;
    margin-bottom: 0;
    background-color: rgba(33, 37, 41, 0.03);
    border-bottom: 1px solid rgba(0, 0, 0, 0.175);
  }
  
  .card-header:first-child {
    border-radius: calc(0.375rem - 1px) calc(0.375rem - 1px) 0 0;
  }
  
  /* Button */
  .btn {
    display: inline-block;
    padding: 0.375rem 0.75rem;
    font-size: 1rem;
    font-weight: 400;
    line-height: 1.5;
    color: #212529;
    text-align: center;
    text-decoration: none;
    vertical-align: middle;
    cursor: pointer;
    user-select: none;
    border: 1px solid transparent;
    border-radius: 0.375rem;
    background-color: transparent;
    transition: color 0.15s ease-in-out, background-color 0.15s ease-in-out, border-color 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
  }
  
  .btn-primary {
    color: #fff;
    background-color: #0d6efd;
    border-color: #0d6efd;
  }
  
  .btn-primary:hover {
    color: #fff;
    background-color: #0b5ed7;
    border-color: #0a58ca;
  }
  
  .btn-primary:focus {
    color: #fff;
    background-color: #0b5ed7;
    border-color: #0a58ca;
    box-shadow: 0 0 0 0.25rem rgba(49, 132, 253, 0.5);
  }
  
  /* Utility classes */
  .mb-2 {
    margin-bottom: 0.5rem !important;
  }
  
  .mb-3 {
    margin-bottom: 1rem !important;
  }
  
  .mb-4 {
    margin-bottom: 1.5rem !important;
  }
  
  .mt-3 {
    margin-top: 1rem !important;
  }
  
  .mx-3 {
    margin-right: 1rem !important;
    margin-left: 1rem !important;
  }
  
  /* Duas colunas: nome flexivel e controles alinhados a direita. */
  /*[Orientado com IA]*/  
  .item-cardapio {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: center;
    gap: 1rem;
  }

  .item-cardapio label {
    overflow-wrap: anywhere;
  }
  
  .quantidade {
    display: inline-flex;
    align-items: center;
    border: 1px solid #eee;
    border-radius: 0.5rem;
    box-shadow: 0 1px 4px #00000010;
  }
  
  .quantidade button {
    border: 0;
    background: transparent;
    color: #ff4055;
    cursor: pointer;
    padding: 0.25rem 0.6rem;
    font-size: 1.25rem;
  }
  
  .quantidade input {
    width: 4ch;
    border: 0;
    padding: 0;
    text-align: center;
    background: transparent;
    appearance: textfield;
    -moz-appearance: textfield;
  }
  
  /* Esconde as setas nativas: usamos apenas os botoes - e +. */
  .quantidade input::-webkit-inner-spin-button,
  .quantidade input::-webkit-outer-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
</style>
</head>

<body>
  <div class="mt-3 mx-3">
    
    <form class="container mt-3" style="max-width: 800px;" method="POST">
      <h1 class="mb-3">Aproveite o Evento!!!</h1>
      <div class="card mb-4">
        <h5 class="card-header">Cardápio do dia:</h5>
        <div class="card-body">

          <p>Aproveite o nosso evento com o melhor da nossa culinária! Veja alguns de nossos itens disponíveis:</p>
          
          <ul> <!-- Inicio de uma lista -->

            <li class="item-cardapio mb-3">
              <label for="campo-item1">Hambúrguer</label>
              <div class="quantidade">
                <button type="button" onclick="alterarQuantidade('campo-item1', -1)">-</button>
                <input id="campo-item1" name="item1" type="number" min="0" value="0" >
                <button type="button" onclick="alterarQuantidade('campo-item1', 1)">+</button>
              </div>
            </li>

            <li class="item-cardapio mb-3">
              <label for="campo-item2">Batata frita</label>
              <div class="quantidade">
                <button type="button" onclick="alterarQuantidade('campo-item2', -1)">-</button>
                <input id="campo-item2" name="item2" type="number" min="0" value="0" >
                <button type="button" onclick="alterarQuantidade('campo-item2', 1)">+</button>
              </div>
            </li>

            <li class="item-cardapio mb-3">
              <label for="campo-item3">Refrigerante</label>
              <div class="quantidade">
                <button type="button" onclick="alterarQuantidade('campo-item3', -1)">-</button>
                <input id="campo-item3" name="item3" type="number" min="0" value="0" >
                <button type="button" onclick="alterarQuantidade('campo-item3', 1)">+</button>
              </div>
            </li>

            <li class="item-cardapio mb-3">
              <label for="campo-item4">Água</label>
              <div class="quantidade">
                <button type="button" onclick="alterarQuantidade('campo-item4', -1)">-</button>
                <input id="campo-item4" name="item4" type="number" min="0" value="0" >
                <button type="button" onclick="alterarQuantidade('campo-item4', 1)">+</button>
              </div>
            </li>

          </ul>
        </div>
      </div>
      <button type="submit" class="btn btn-primary">Confirmar pedido</button>
    </form>
  </div>

  <script>
    // A mesma funcao atende todos os produtos. O id indica qual campo alterar.
    //[Feito com o suporte de IA]
    function alterarQuantidade(id, alteracao) {
      const campo = document.getElementById(id);
      
      if (alteracao === 1) {
        campo.stepUp(); // Soma uma unidade
      } else if (campo.valueAsNumber > 0) {
        campo.stepDown(); // Subtrai uma unidade
      }
      
      // Mantem o numero visivel quando a quantidade ganha mais digitos.
      campo.style.width = Math.max(4, campo.value.length + 1) + 'ch';
    }
  </script>
</body>



</html>
