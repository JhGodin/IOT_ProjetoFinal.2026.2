<!-- ///////nebu/////// login do organizador, para publicar avisos em /avisos -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login do organizador</title>
</head>
<body>
  <h1>Login do organizador</h1>
  <form action="{{ destino or '/avisos' }}" method="POST">
    <label for="campo-usuario">Usuario</label><br>
    <input id="campo-usuario" name="usuario" type="text" required><br>
    <label for="campo-senha">Senha</label><br>
    <input id="campo-senha" name="senha" type="password" required><br>
    <button type="submit">Entrar</button>
  </form>
</body>
</html>
