<!-- ///////gabriel/////// erro simples do pedido (link invalido, quantidade invalida ou pedido vazio) -->
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pedido não registrado</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='estilo.css') }}">
</head>
<body>
  <div class="container mt-3" style="max-width: 800px;">
    <h1 class="mb-3">Pedido não registrado</h1>

    <div class="card mb-4">
      <div class="card-body">
        <p class="destaque erro">{{ mensagem }}</p>
        {% if not voltar %}
        <p>Procure o totem de cadastro para gerar um novo link.</p>
        {% endif %}
      </div>
    </div>

    {% if voltar %}
    <form action="{{ voltar }}" method="GET">
      <button type="submit" class="btn btn-primary">Voltar ao cardápio</button>
    </form>
    {% endif %}
  </div>
</body>
</html>
